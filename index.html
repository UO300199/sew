<!DOCTYPE HTML>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<title>Ejemplos de HTML5: Tabla</title>
</head>
<body>
	<h1>Ejemplos de HTML5: Tablas</h1>

	<h2>Tabla Sencilla - accesible</h2>
	<p>Debe contener <code>scope, headers e id</code>. </p>
	<table>
  <caption>Tabla de horario accesible</caption>

    </tr>

      <td>L.8</td>
      <td>TEO.2</td>

      <td>-</td>
    </tr>
    <tr>
      <th scope="row">13.00-15.00</th>
      <td>L.9</td>
      <td>L.2</td>
      <td>L.10</td>
      <td>-</td>
      <td>-</td>
    </tr>
    <tr>
      <th scope="row">14.00-16.00</th>
      <td>-</td>
      <td>-</td>
      <td>-</td>
      <td>-</td>
      <td>L.3</td>
    </tr>
  </tbody>
</table>

</body>
</html>
